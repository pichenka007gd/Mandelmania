name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Source smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 5
        run: |
          set +e
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy timeout 90 uv run python main.py
          code=$?
          echo "exit code: $code"
          [ $code -eq 124 ]

      - name: Source smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $job = Start-Job -ScriptBlock {
            Set-Location $using:pwd.Path
            $env:SDL_VIDEODRIVER = 'dummy'
            $env:SDL_AUDIODRIVER = 'dummy'
            uv run python main.py
          }
          Wait-Job -Job $job -Timeout 90 | Out-Null
          if ($job.State -ne 'Running') {
            Write-Host "Process exited early with state $($job.State):"
            Receive-Job -Job $job | Out-String | Write-Host
            Remove-Job -Job $job -Force
            exit 1
          }
          Stop-Job -Job $job
          Remove-Job -Job $job -Force
          Write-Host "Process survived 90s - OK"

      - name: Build binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: uv run pyinstaller --noconfirm --onefile --name Mandelmania main.py

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: uv run pyinstaller --noconfirm --onefile --windowed --name Mandelmania main.py

      - name: Binary smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 5
        run: |
          set +e
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy timeout 120 ./dist/Mandelmania
          code=$?
          echo "exit code: $code"
          [ $code -eq 124 ]

      - name: Binary smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:SDL_VIDEODRIVER = 'dummy'
          $env:SDL_AUDIODRIVER = 'dummy'
          $proc = $null
          try {
            $proc = Start-Process -FilePath ".\dist\Mandelmania.exe" -PassThru
            Start-Sleep -Seconds 90
            $proc.Refresh()
            if ($proc.HasExited) {
              Write-Host "Binary exited early with code $($proc.ExitCode)"
              exit 1
            }
            Write-Host "Binary survived 90s - OK"
          } finally {
            if ($null -ne $proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - name: Rename asset (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: mv dist/Mandelmania dist/Mandelmania-linux-x86_64

      - name: Rename asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item -Path dist\Mandelmania.exe -Destination dist\Mandelmania-windows-x86_64.exe

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ runner.os }}
          path: dist/Mandelmania-*-x86_64*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: assets

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
